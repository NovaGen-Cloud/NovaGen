name: NovaGen Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Fix project structure
        shell: bash
        run: |
          mkdir -p src assets
          for f in app.js countries.js name-packs.js names.js styles.css totp.js; do
            if [ -f "$f" ]; then
              mv "$f" src/
            fi
          done
          if [ -f "logo.svg" ]; then
            mv logo.svg assets/
          fi

      - name: Prepare web assets
        shell: bash
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          cp -r src www/
          cp -r assets www/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund

      - name: Install TypeScript
        run: npm install --save-dev typescript --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaGen-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
